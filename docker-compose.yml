# Atlas with its optional community layer.
#
# The `atlas` service runs on its own: with no database and no minio reachable,
# the dashboard, sweeps and river gauges all work and the ground-report and
# digest sections hide themselves.
#
# The database is Supabase and is therefore not a container — it is the same
# hosted project in development as in production. Set the Supabase variables in
# .env; minio is here so that `docker compose up` still gives you photo uploads
# without a second hosted dependency. In production point MINIO_ENDPOINT at the
# shared Ancoda storage and start only the atlas service.

services:
  atlas:
    build: ./frontend
    ports:
      - "${PORT:-3117}:${PORT:-3117}"
    env_file:
      - .env
    environment:
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-localhost:9000}
      MINIO_SECURE: ${MINIO_SECURE:-false}
      MINIO_BUCKET: ${MINIO_BUCKET:-atlas}
    volumes:
      - ./frontend/runs:/app/runs
    depends_on:
      minio:
        condition: service_healthy
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-atlas}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  minio_data:
